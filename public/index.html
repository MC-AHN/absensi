<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Geist:wght@100;400;700&display=swap"
            rel="stylesheet"
        />
        <style>
            body {
                font-family: "Geist", sans-serif;
            }

            .glass-card {
                background: rgba(18, 18, 18, 0.8);
                backdrop-filter: blur(12px);
                border: 1px solid rgba(255, 255, 255, 0.05);
            }
        </style>
    </head>

    <body
        class="bg-[#050505] text-gray-200 min-h-screen flex items-center justify-center p-6"
    >
        <div class="max-w-md w-full">
            <div class="text-center mb-10">
                <h2
                    class="text-xs tracking-[0.4em] text-blue-500 font-bold uppercase mb-2"
                >
                    Internal System
                </h2>
                <h1 class="text-3xl font-bold tracking-tighter text-white">
                    ABSENSI <span class="font-thin text-gray-500">v1.0</span>
                </h1>
            </div>

            <!-- Main Card -->
            <div class="glass-card rounded-3xl p-8 shadow-2xl">
                <div class="space-y-6">
                    <!-- input group -->
                    <div>
                        <label
                            for="identifier"
                            class="text-[10px] uppercase tracking-widest text-gray-500 ml-1 mb-2 block"
                            >Personal Identifier</label
                        >
                        <input
                            type="text"
                            class="w-full bg-black/50 border border-white/10 rounded-xl px-5 py-4 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all duration-300 placeholder:text-gray-700"
                            placeholder="Enter ID or Email Address"
                            id="identifier" name="identifier"
                        />
                    </div>
                    <!-- Action Buttons -->
                    <div class="grid grid-cols-2 gap-4">
                        <button
                            onclick="checkIn()"
                            class="bg-white text-black font-body py-4 rounded-xl hover:bg-gray-200 transition-all duration-300 active:scale-95 shadow-lg shadow-white/5"
                        >
                            CHECK IN
                        </button>
                        <button
                            onclick="checkOut()"
                            class="border border-white/10 text-white font-bold py-4 rounded-xl hover:bg-white/5 transition-all duration-300 active:scale-95"
                        >
                            CHECK OUT
                        </button>
                    </div>
                </div>

                <div
                    id="status-container"
                    class="mt-8 pt-6 border-t border-white/5 hidden"
                >
                    <p
                        id="result"
                        class="text-center text-sm font-medium tracking-wide text-blue-400"
                    ></p>
                </div>
            </div>

            <!-- footer info -->
            <p
                class="text-center mt-10 text-[10px] text-gray-600 tracking-[0.2em] uppercase"
            >
                Optimization Mode: Active • Secured Terminal
            </p>
        </div>

        <script>
            function updateUI(message) {
                const container = document.getElementById("status-container");
                const resultEl = document.getElementById("result");
                container.classList.remove("hidden");
                resultEl.innerText = message;
            }

            async function checkIn() {
                const identifier = document.getElementById("identifier").value;
                if (!identifier) return updateUI("Please enter an identifier");

                const res = await fetch("/api/user/check-in", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ identifier }),
                });

                const data = await res.json();
                updateUI(data.message);
            }

            async function checkOut() {
                const identifier = document.getElementById("identifier").value;
                if (!identifier) return updateUI("Please enter an identifier");

                const res = await fetch("/api/user/check-out", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ identifier }),
                });

                const data = await res.json();
                updateUI(data.message);
            }
        </script>
    </body>
</html>
