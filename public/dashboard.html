<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Elite System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Geist', sans-serif; }
        .glass-card {
            background: rgba(18, 18, 18, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        /* Custom scrollbar untuk table jika overflow */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #222; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #333; }
    </style>
</head>
<body class="bg-[#050505] text-gray-300 min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-8">
        
        <header class="glass-card rounded-2xl px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h2 class="text-[10px] tracking-[0.4em] text-blue-500 font-bold uppercase">Management Console</h2>
                <h1 class="text-xl font-bold tracking-tight text-white">DASHBOARD <span class="font-thin text-gray-500">ADMIN</span></h1>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-right">
                    <p class="text-xs text-gray-500 uppercase tracking-wider">Authenticated As</p>
                    <strong id="adminLabel" class="text-sm font-semibold text-white">-</strong>
                </div>
                <button onclick="logout()" class="border border-red-500/20 text-red-400 hover:bg-red-500/10 px-4 py-2 rounded-xl text-xs font-medium tracking-wider transition-all active:scale-95">
                    LOGOUT
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <section class="lg:col-span-1 space-y-4">
                <div class="glass-card rounded-2xl p-6">
                    <h3 class="text-sm font-bold tracking-widest text-white uppercase border-b border-white/5 pb-3 mb-6">Add New Personnel</h3>
                    
                    <form onsubmit="addUser(event)" class="space-y-4">
                        <div>
                            <label class="text-[10px] uppercase tracking-widest text-gray-500 block mb-2">Full Name</label>
                            <input type="text" name="name" id="name" required
                                class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                        </div>
                        <div>
                            <label class="text-[10px] uppercase tracking-widest text-gray-500 block mb-2">Email Address</label>
                            <input type="email" name="email" id="email" required
                                class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                        </div>
                        <div>
                            <label class="text-[10px] uppercase tracking-widest text-gray-500 block mb-2">Secure Password</label>
                            <input type="password" name="pass" id="pass" required
                                class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                        </div>
                        <div>
                            <label class="text-[10px] uppercase tracking-widest text-gray-500 block mb-2">System Role</label>
                            <div class="relative">
                                <select name="role" id="role"
                                    class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all appearance-none">
                                    <option value="user" class="bg-[#121212]">User</option>
                                    <option value="admin" class="bg-[#121212]">Admin</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" 
                            class="w-full bg-white text-black font-bold py-3 rounded-xl hover:bg-gray-200 transition-all active:scale-95 text-xs tracking-widest mt-2 shadow-lg shadow-white/5">
                            REGISTER USER
                        </button>
                    </form>
                    <p id="result" class="mt-4 text-center text-xs text-blue-400 font-medium italic min-h-[16px]"></p>
                </div>
            </section>

            <div class="lg:col-span-2 space-y-8">
                
                <section class="glass-card rounded-2xl p-6">
                    <h3 class="text-sm font-bold tracking-widest text-white uppercase border-b border-white/5 pb-3 mb-4">Personnel Directory</h3>
                    <div class="overflow-x-auto w-full">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-white/10">
                                    <th class="py-3 px-4 text-[10px] font-bold uppercase tracking-widest text-gray-500">Name</th>
                                    <th class="py-3 px-4 text-[10px] font-bold uppercase tracking-widest text-gray-500">Email</th>
                                    <th class="py-3 px-4 text-[10px] font-bold uppercase tracking-widest text-gray-500">Role</th>
                                    <th class="py-3 px-4 text-[10px] font-bold uppercase tracking-widest text-gray-500 text-right">Status</th>
                                </tr>
                            </thead>
                            <tbody id="tbody" class="text-sm divide-y divide-white/5 text-gray-300">
                                <tr>
                                    <td colspan="4" class="py-4 px-4 text-gray-500 italic">Loading database registry...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>

                <section class="glass-card rounded-2xl p-6">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between border-b border-white/5 pb-4 mb-4 gap-4">
                        <h3 class="text-sm font-bold tracking-widest text-white uppercase">Recap Absensi</h3>
                        <div class="flex items-center gap-2">
                            <input type="month" name="month" id="month"
                                class="bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500 transition-all [color-scheme:dark]">
                            <button onclick="loadAbsensi()" 
                                class="border border-white/10 text-white hover:bg-white/5 px-4 py-2 rounded-xl text-xs font-bold tracking-wider transition-all active:scale-95">
                                SHOW
                            </button>
                        </div>
                    </div>
                    <p id="absensiResult" class="text-xs text-red-400 italic mb-2 min-h-[16px]"></p>

                    <div class="overflow-x-auto w-full">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-white/10">
                                    <th class="py-3 px-4 text-[10px] font-bold uppercase tracking-widest text-gray-500">Name</th>
                                    <th class="py-3 px-4 text-[10px] font-bold uppercase tracking-widest text-gray-500">Email</th>
                                    <th class="py-3 px-4 text-[10px] font-bold uppercase tracking-widest text-gray-500">Check In</th>
                                    <th class="py-3 px-4 text-[10px] font-bold uppercase tracking-widest text-gray-500">Check Out</th>
                                    <th class="py-3 px-4 text-[10px] font-bold uppercase tracking-widest text-gray-500">Note</th>
                                </tr>
                            </thead>
                            <tbody id="absensiTableBody" class="text-sm divide-y divide-white/5 text-gray-300">
                                <tr>
                                    <td colspan="5" class="py-4 px-4 text-gray-500 italic">Select month target and query to display logs.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>

            </div>
        </div>

        <footer class="text-center text-[10px] text-gray-600 tracking-[0.2em] uppercase pt-4">
            Secure Administrator Panel • Connection Encrypted
        </footer>
    </div>

    <script>
        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        document.getElementById("month").value = `${yyyy}-${mm}`;

        (async () => {
            const res = await fetch('/api/auth/me', { credentials: "include" });
            if (!res.ok) { window.location.href = "/login.html"; return;}
            const { user } = await res.json();
            document.getElementById("adminLabel").textContent = user.name;
            await loadUsers();
            await loadAbsensi();
        })();

        async function loadUsers() {
            const res = await fetch('/api/admin/users', { credentials: "include" });
            if (res.status === 401 || res.status === 403) { window.location.href = '/login.html'; return; }
            const { data } = await res.json();
            const tbody = document.getElementById("tbody");
            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="py-4 px-4 text-center text-gray-500">User is empty.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(u => `
                <tr class="hover:bg-white/[0.02] transition-colors">
                    <td class="py-3 px-4 font-medium text-white">${u.name}</td>
                    <td class="py-3 px-4 text-gray-400">${u.email}</td>
                    <td class="py-3 px-4"><span class="text-[11px] px-2 py-0.5 border border-white/10 rounded-md tracking-wider text-gray-400 uppercase">${u.role}</span></td>
                    <td class="py-3 px-4 text-right">
                        <span class="inline-flex items-center gap-1.5 text-xs ${u.is_active ? 'text-green-400' : 'text-gray-500'}">
                            <span class="w-1.5 h-1.5 rounded-full ${u.is_active ? 'bg-green-400 animate-pulse' : 'bg-gray-600'}"></span>
                            ${u.is_active ? "Active" : "NonActive"}
                        </span>
                    </td>
                </tr>
                `
            ).join('');
        }

        async function addUser(e) {
            e.preventDefault();
            const body = {
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('pass').value,
                role: document.getElementById('role').value,
            };

            const res = await fetch('/api/admin/users', {
                method: "POST",
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
                credentials: "include",
            });
            const data = await res.json();
            document.getElementById("result").textContent = data.message;

            if (res.ok) {
                e.target.reset();
                await loadUsers();
            }
        }

        async function loadAbsensi() {
            const month = document.getElementById("month").value;
            if (!month) {
                document.getElementById('absensiResult').textContent = "Choose month early.";
                return;
            }

            const res = await fetch(`/api/admin/attendances?month=${month}`, { credentials: "include" });
            const data = await res.json();
            const tbody = document.getElementById("absensiTableBody");
            document.getElementById("absensiResult").textContent = '';

            if (!res.ok) {
                document.getElementById('absensiResult').textContent = data.message;
                tbody.innerHTML = `<tr><td colspan="5" class="py-4 px-4 text-center text-gray-500">-</td></tr>`
                return;
            }

            if (!data.data || data.data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-4 px-4 text-center text-gray-500">Not Found data absensi in this month</td></tr>`;
                return;
            }

            tbody.innerHTML = data.data.map(a => `
                <tr class="hover:bg-white/[0.02] transition-colors">
                    <td class="py-3 px-4 font-medium text-white">${a.user_name ?? '-'}</td>
                    <td class="py-3 px-4 text-gray-400">${a.user_email ?? '-'}</td>
                    <td class="py-3 px-4 text-blue-400">${formatTanggal(a.check_in)}</td>
                    <td class="py-3 px-4 ${a.check_out ? 'text-gray-300' : 'text-gray-600'}">${a.check_out ? formatTanggal(a.check_out) : '-'}</td>
                    <td class="py-3 px-4 text-gray-400 text-xs">${a.note ?? '-'}</td>
                </tr>
            `).join('');
        }

        function formatTanggal(iso) {
            if (!iso) return '-';
            const d = new Date(iso);
            return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) + ' ' + d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        }

        async function logout() {
            await fetch('/api/auth/logout', { method: 'POST', credentials: "include" });
            window.location.href = '/login.html'
        }
    </script>
</body>
</html>
